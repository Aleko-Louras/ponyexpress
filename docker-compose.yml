# docker-compose.yml
# Used locally (docker-compose up --build)
# AND on EC2 (with ECR image URLs injected via environment variables)

version: "3.8"

services:

  backend:
    image: ${BACKEND_ECR_URL:-ponyexpress-backend}:latest
    build:
      context: ./backend
    container_name: ponyexpress-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${FRONTEND_ECR_URL:-ponyexpress-frontend}:latest
    build:
      context: ./frontend
    container_name: ponyexpress-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped